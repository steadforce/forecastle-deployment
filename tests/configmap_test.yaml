suite: forecastle configmap data driven by root config values
templates:
- charts/forecastle/templates/configmap.yaml
tests:
- it: sets the header colors and title from root values
  asserts:
  - matchRegex:
      path: &configDataPath data["config.yaml"]
      pattern: "headerBackground: '#0a283c'"
  - matchRegex:
      path: *configDataPath
      pattern: "headerForeground: '#05AB7F'"
  - matchRegex:
      path: *configDataPath
      pattern: 'title: STEADFORCE APPS'

- it: enables the crd-backed app discovery flag
  asserts:
  - matchRegex:
      path: *configDataPath
      pattern: 'crdEnabled: true'

- it: enables selecting apps from any namespace
  asserts:
  - matchRegex:
      path: *configDataPath
      pattern: 'any: true'

- it: removes the subchart default namespaceSelector matchNames via the root null override
  asserts:
  - notMatchRegex:
      path: *configDataPath
      pattern: 'matchNames'
  - matchSnapshot:
      path: *configDataPath
