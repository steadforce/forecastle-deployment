suite: test if the resource settings for forecastle container in cluster is correct
release:
  name: forecastle
templates:
  - charts/forecastle/templates/deployment.yaml
  - charts/forecastle/templates/configmap.yaml
tests:
  - it: snapshot test for detecting side effects on forecastle-deployment during development on local
    asserts:
    - matchSnapshot: {}
    values: &localValues
    - ../values-subchart-overrides.yaml
    - ../values-local.yaml
  - it: snapshot test for detecting side effects on forecastle-deployment during development on dev
    asserts:
    - matchSnapshot: {}
    values: &devValues
    - ../values-subchart-overrides.yaml
    - ../values-development.yaml
  - it: snapshot test for detecting side effects on forecastle-deployment during local development on prod
    asserts:
    - matchSnapshot: {}
    values: &prodValues
    - ../values-subchart-overrides.yaml
    - ../values-production.yaml
    
  - it: forecastle container resources for local cluster
    values: *localValues
    template: charts/forecastle/templates/deployment.yaml
    asserts:
    - matchRegex:
        path: &cpuLimitsPath spec.template.spec.containers[?(@.name == "forecastle")].resources.limits.cpu
        # on local cluster we expect 0 or 0m cpu limits
        pattern: &localCpuPattern "^0(m)?$"
    - matchRegex:
        path: &memoryLimitsPath spec.template.spec.containers[?(@.name == "forecastle")].resources.limits.memory
        # on local cluster we expect non 0 memory limits
        pattern: &nonZeroMemoryPattern "^[1-9][0-9]*(Ki|Mi|Gi)?$"
    - matchRegex:
        path: &requestsCpuPath spec.template.spec.containers[?(@.name == "forecastle")].resources.requests.cpu
        # on local cluster we expect 0 or 0m cpu requests
        pattern: *localCpuPattern
    - matchRegex:
        path: &requestsMemoryPath spec.template.spec.containers[?(@.name == "forecastle")].resources.requests.memory
        # on local cluster we expect 0 or 0Mi 0Gi memory requests
        pattern: "^0(Ki|Mi|Gi)?$"

  - it: forecastle container resources for dev-cloud01 cluster
    values: *devValues
    template: charts/forecastle/templates/deployment.yaml
    asserts: &nonLocalResourcesAsserts
    - matchRegex:
        path: *cpuLimitsPath
        # on non local cluster we expect >= 1m cpu limits
        pattern: &cpuPattern "^[1-9][0-9]*(m)?$"
    - matchRegex:
        path: *memoryLimitsPath
        # on non local cluster we expect non 0 memory limits
        pattern: *nonZeroMemoryPattern
    - matchRegex:
        path: *requestsCpuPath
        # on non local cluster we expect  >= 1m cpu requests
        pattern: *cpuPattern
    - matchRegex:
        path: *requestsMemoryPath
        # on non local cluster we expect non 0 memory requests
        pattern: *nonZeroMemoryPattern

  - it: forecastle container resources for prod-cloud01 cluster
    values: *prodValues
    template: charts/forecastle/templates/deployment.yaml
    asserts: *nonLocalResourcesAsserts